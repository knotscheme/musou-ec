name: Update learn videos

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST 毎日
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch YouTube videos -> src/data/videos.json
        run: node scripts/fetch-videos.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain src/data/videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/videos.json
            git commit -m "chore: update videos.json via GitHub Actions"
            git push
          else
            echo "変更なし"
          fi
