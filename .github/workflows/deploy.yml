name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 動画データ更新ワークフローが main に commit しても push イベントは発火しないため、
  # その完了をトリガーにして再ビルドする
  workflow_run:
    workflows: ["Update learn videos"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: /musou-ec
          # アンケート集計先（GAS ウェブアプリ URL）。未設定なら各ブラウザ内保存のみ。
          NEXT_PUBLIC_WISHLIST_ENDPOINT: ${{ secrets.WISHLIST_ENDPOINT }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
